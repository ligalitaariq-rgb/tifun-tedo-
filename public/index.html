<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="Screenshot 2025-12-28 085733.jpg">
  <title>Tifun-tedo - Login / Signup</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a0a00 0%, #3b1200 40%, #5c2000 70%, #2d0d00 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
    }

    /* ===================== ANIMATED BACKGROUND ===================== */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .bg-item {
      position: absolute;
      bottom: -100px;
      font-size: 50px;
      opacity: 0;
      animation: floatUp 15s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 0.2;
      }

      90% {
        opacity: 0.1;
      }

      100% {
        transform: translateY(-120vh) rotate(360deg);
        opacity: 0;
      }
    }

    .bg-item:nth-child(1) {
      left: 10%;
      animation-delay: 0s;
    }

    .bg-item:nth-child(2) {
      left: 30%;
      animation-delay: 4s;
    }

    .bg-item:nth-child(3) {
      left: 50%;
      animation-delay: 8s;
    }

    .bg-item:nth-child(4) {
      left: 70%;
      animation-delay: 2s;
    }

    .bg-item:nth-child(5) {
      left: 90%;
      animation-delay: 6s;
    }

    /* ===================== LOGIN CARD ===================== */
    .container {
      position: relative;
      width: 400px;
      perspective: 1000px;
      z-index: 10;
    }

    .card {
      width: 100%;
      position: relative;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .card.flip {
      transform: rotateY(180deg);
    }

    .card-front,
    .card-back {
      width: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      padding: 40px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    .card-front {
      position: relative;
      transition: opacity 0s 0.3s;
      opacity: 1;
    }

    .card.flip .card-front {
      opacity: 0;
    }

    .card-back {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotateY(180deg);
      transition: opacity 0s 0.3s;
      opacity: 0;
    }

    .card.flip .card-back {
      opacity: 1;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 30px;
      text-align: center;
      background: linear-gradient(to right, #f0a060, #d46a3a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #ccc;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      border-color: #d46a3a;
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #c24d2c, #e37a3f);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(194, 77, 44, 0.4);
    }

    .toggle-text {
      text-align: center;
      margin-top: 25px;
      font-size: 0.9rem;
      color: #ccc;
    }

    .toggle-text span {
      color: #f0a060;
      cursor: pointer;
      font-weight: 600;
      text-decoration: underline;
    }

    .error-msg {
      color: #ff6b6b;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 10px;
      display: none;
    }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6337324788887299"
     crossorigin="anonymous"></script>
</head>

<body>

  <div class="bg-animation">
    <div class="bg-item">🥩</div>
    <div class="bg-item">🍖</div>
    <div class="bg-item">🥘</div>
    <div class="bg-item">🍛</div>
    <div class="bg-item">🎊</div>
  </div>

  <div class="container">
    <div class="card" id="card">
      <!-- LOGIN FORM -->
      <div class="card-front">
        <h2>Welcome Back</h2>
        <form id="loginForm">
          <div class="input-group">
            <label>Username</label>
            <input type="text" id="loginUser" required placeholder="Enter username">
          </div>
          <div class="input-group">
            <label>Password</label>
            <input type="password" id="loginPass" required placeholder="Enter password">
          </div>
          <button type="submit" class="btn">Login</button>
          <div id="loginError" class="error-msg"></div>
          <div class="toggle-text">
            Don't have an account? <span onclick="toggleCard()">Sign up</span>
          </div>
        </form>
      </div>

      <!-- SIGNUP FORM -->
      <div class="card-back">
        <h2>Create Account</h2>
        <form id="signupForm">
          <div class="input-group">
            <label>Username</label>
            <input type="text" id="signupUser" required placeholder="Choose a username">
          </div>
          <div class="input-group">
            <label>Password</label>
            <input type="password" id="signupPass" required placeholder="Create a password">
          </div>
          <button type="submit" class="btn">Sign Up</button>
          <div id="signupError" class="error-msg"></div>
          <div class="toggle-text">
            Already have an account? <span onclick="toggleCard()">Login</span>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    function toggleCard() {
      document.getElementById('card').classList.toggle('flip');
    }

    // Signup Logic
    document.getElementById('signupForm').onsubmit = async (e) => {
      e.preventDefault();
      const username = document.getElementById('signupUser').value.trim();
      const password = document.getElementById('signupPass').value;
      const errorDiv = document.getElementById('signupError');

      errorDiv.innerText = '';
      errorDiv.style.display = 'none';

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          alert('Signup successful! Please login.');
          document.getElementById('signupForm').reset();
          toggleCard();
        } else {
          errorDiv.innerText = data.message || 'Signup failed';
          if (data.error) errorDiv.innerText += `: ${data.error}`;
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.innerText = 'Server connection error';
        errorDiv.style.display = 'block';
      }
    };

    // Login Logic
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      const errorDiv = document.getElementById('loginError');

      errorDiv.innerText = '';
      errorDiv.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('user', JSON.stringify(data.user));
          if (data.user.isAdmin) {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'selection.html';
          }
        } else {
          errorDiv.innerText = data.message || 'Login failed';
          if (data.error) errorDiv.innerText += `: ${data.error}`;
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.innerText = 'Server connection error';
        errorDiv.style.display = 'block';
      }
    };
  </script>

  <div style="position: fixed; bottom: 20px; left: 0; width: 100%; text-align: center; font-size: 0.85rem; color: rgba(255,255,255,0.5); z-index: 5;">
    Customer Care: <a href="tel:08058462020" style="color: #f0a060; text-decoration: none; font-weight: 600;">08058462020</a>
  </div>
</body>

</html>
